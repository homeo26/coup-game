<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join a Coup game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0e1014; color: #eef0f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    background: #171a20; border: 1px solid rgba(200,210,230,.12);
    border-radius: 22px; padding: 32px 24px 28px;
    box-shadow: 0 18px 48px rgba(0,0,0,.5);
  }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 6px; }
  .tag { margin: 0 0 22px; color: #a7adba; font-size: 13px; }
  .code {
    font-size: 44px; font-weight: 800; letter-spacing: 14px;
    color: #e9ebf0; margin: 6px 0 4px;
  }
  .codelabel { color: #646a76; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
  a.btn {
    display: block; margin-top: 22px; padding: 15px 18px; border-radius: 14px;
    text-decoration: none; font-weight: 700; font-size: 16px;
  }
  .open { background: #c9ccd4; color: #14161a; }
  .get { background: transparent; color: #e9ebf0; border: 1.5px solid rgba(200,210,230,.28); margin-top: 10px; }
  .hint { margin-top: 18px; color: #646a76; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>COUP</h1>
    <p class="tag">Bluff. Challenge. Survive.</p>
    <div class="codelabel">Room code</div>
    <div class="code" id="code">····</div>
    <a class="btn open" id="open" href="#">Open in Coup</a>
    <a class="btn get" href="https://github.com/homeo26/coup-game/releases/latest">Don't have the app? Get it</a>
    <p class="hint" id="hint">If the app is installed, this opens the room directly.</p>
  </div>
<script>
  var m = location.pathname.match(/\/join\/([A-Za-z]{4})/);
  var code = m ? m[1].toUpperCase() : '';
  if (code) {
    document.getElementById('code').textContent = code;
    var deep = 'coupgame://join/' + code;
    document.getElementById('open').href = deep;
    // try to hand off to the app immediately
    setTimeout(function () { location.href = deep; }, 350);
  } else {
    document.getElementById('code').textContent = '—';
    document.getElementById('hint').textContent =
      'This link is missing a room code. Ask your friend to share it again.';
  }
</script>
</body>
</html>
